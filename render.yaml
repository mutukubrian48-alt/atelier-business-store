services:
  - type: web
    name: atelier-business-store
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/public/bootstrap
    autoDeploy: true
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/store.sqlite
      - key: ADMIN_EMAIL
        value: mutukubrian95@gmail.com
      - key: ADMIN_PASSWORD
        sync: false
    disk:
      name: atelier-store-data
      mountPath: /var/data
      sizeGB: 1
